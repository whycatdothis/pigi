appId: pink.pigi
productName: pigi
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!docs'
  - '!.pi'
asarUnpack:
  - resources/**
  # Native module: its .node binary must live outside the asar to be require-able.
  - node_modules/node-pty/**
  # fff (file search) loads its native library through ffi-rs via dlopen.
  - node_modules/@ff-labs/**
  - node_modules/ffi-rs/**
  - node_modules/@yuuang/**
win:
  executableName: pigi
nsis:
  # electron-builder's default for `pink.pigi` (UUIDv5 of the appId, namespace
  # 50e065bc-3134-11e6-9bab-38c9862bdaf3), frozen by hand: the installer keys and
  # the in-place upgrade lookup go by this id, so it must not follow a later
  # appId change.
  guid: a7ddab61-935b-5134-ad45-dd5bed35a614
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
dmg:
  # No version in the file name, on purpose: it is what lets the site link to
  # `releases/latest/download/pigi-arm64.dmg` — a URL GitHub resolves against
  # whichever release is newest when someone clicks, so a published release is
  # downloadable immediately, with nothing to rebuild. See website/src/lib/site.ts.
  artifactName: ${name}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: whycatdothis
  repo: pigi
