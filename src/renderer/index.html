<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>pigi</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- `local-file:` is only reachable as an image: it carries no fetch privileges
         (see protocol.registerSchemesAsPrivileged in main/index.ts). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: package-image: local-file:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
